name: Test build (unsigned)
# Builds the Mac (Apple Silicon) and Windows program files for a branch without
# the upstream signing certificates, then runs the backend tests that cover
# input, discovery and Direct connection. The results are unsigned binaries for
# local testing; they are not installable, signed or notarized packages.
on:
  push:
    branches: ['claude/**']
    paths:
      - 'crates/**'
      - 'apps/oink/**'
      - '.github/workflows/macos-test-build.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: test-build-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  PYTHONUTF8: '1'
  MACOSX_DEPLOYMENT_TARGET: '14.2'
  CMAKE_POLICY_VERSION_MINIMUM: '3.5'
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            name: macos-arm64
            jobs: '3'
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            name: windows-x64
            jobs: '4'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    env:
      CARGO_BUILD_JOBS: ${{ matrix.jobs }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: '1.99.0'
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: test-build-${{ matrix.target }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14.6'
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24.14.1'
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4
        with:
          path: |
            ~/.cargo/bin/cargo-about*
            ${{ runner.temp }}/package-tools
          key: test-build-tools-${{ runner.os }}-${{ runner.arch }}-rust1.99.0-about0.9.2-sparkle2.9.6
      - name: Pin build tools
        shell: bash
        run: |
          npm install --global npm@11.11.0
          if ! cargo about --version 2>/dev/null | grep -q '0.9.2$'; then cargo install cargo-about --version 0.9.2 --locked --features cli; fi
      - name: Build unsigned product binaries
        shell: bash
        run: |
          tree=$(python -c "import sys; sys.path.insert(0, 'build-support'); from provenance import source_tree_sha256; print(source_tree_sha256())")
          args=()
          if [[ "$RUNNER_OS" == macOS ]]; then args+=(--sparkle-cache "$RUNNER_TEMP/package-tools"); fi
          python build-support/build.py --target ${{ matrix.target }} --build 108 \
            --source-tree-sha256 "$tree" "${args[@]}"
      - name: Collect binaries
        shell: bash
        run: |
          out="$RUNNER_TEMP/oink-${{ matrix.name }}"
          mkdir -p "$out"
          rel=target/${{ matrix.target }}/release
          if [[ "$RUNNER_OS" == macOS ]]; then
            cp "$rel"/oink "$rel"/oink-agent "$rel"/oink-backend "$rel"/oink-crash-collector "$out"/
          else
            cp "$rel"/*.exe "$out"/
            cp "$rel"/OinkCredentialProvider.dll "$out"/ 2>/dev/null || true
          fi
          cp "$rel"/release-build.json "$out"/
          python - "$out" <<'PY'
          import hashlib, pathlib, sys
          out = pathlib.Path(sys.argv[1])
          lines = [f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}" for p in sorted(out.iterdir()) if p.name != 'SHA256SUMS']
          (out / 'SHA256SUMS').write_text('\n'.join(lines) + '\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: oink-${{ matrix.name }}-unsigned
          path: ${{ runner.temp }}/oink-${{ matrix.name }}
          retention-days: 14
      - name: Input tests (macOS)
        if: runner.os == 'macOS'
        run: cargo test --locked -p oink-input --target ${{ matrix.target }}
      - name: Direct connection and discovery tests
        shell: bash
        run: |
          cargo test --locked -p oink-agent --lib --target ${{ matrix.target }} -- \
            direct_cable direct_first_puts_cable battery_slows_checks
          cargo test --locked -p oink-network --lib --target ${{ matrix.target }} -- cable_only
