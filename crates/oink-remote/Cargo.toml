[package]
name = "oink-remote"
description = "Remote desktop over a private network such as Tailscale: screen capture, tile video and input for the host; a viewer window for the client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
blake3 = "1.8"
clap = { version = "4.5", features = ["derive"] }
getrandom = "0.3"
# The JPEG encoder; decoding uses zune-jpeg directly to write BGRA pixels.
image = { version = "0.25", default-features = false, features = ["jpeg"] }
zune-core = "0.5"
zune-jpeg = "0.5"

# The viewer window. Not built on Linux, where the window toolkit needs GTK.
[target.'cfg(any(target_os = "macos", windows))'.dependencies]
softbuffer = { version = "0.4", default-features = false }
tao = "0.37"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Power",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[lints]
workspace = true

[[bin]]
name = "oink-remote"
path = "src/main.rs"
